[package]
name = "proxlet"
version = "0.1.3"
edition = "2024"
description = "A portable HTTP, HTTPS and SOCKS5 proxy server with proxy chaining"
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
ipnet = "2.11"
libc = "0.2"
percent-encoding = "2.3"
russh = { version = "0.61", default-features = false, features = [
    "ring",
    "rsa",
] }
rustls-pemfile = "2.2"
tokio = { version = "1.48", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
url = "2.5"
webpki-roots = "1.0"

[dev-dependencies]
rand_core = "0.10"
tempfile = "3.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
